[project]
name = "webresearch-ai"
version = "1.0.0"
description = "AI web research agent: searches the web, reads pages and answers with checked citations."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Muhammad Usman Shabbir" }]
dependencies = ["streamlit>=1.40", "ddgs>=9.0", "trafilatura>=2.0", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
